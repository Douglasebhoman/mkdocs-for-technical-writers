site_name: MkDocs for Technical Writers
site_url: https://douglasebhoman.com/mkdocs-for-technical-writers/
site_author: Douglas Ebhoman
site_description: A complete guide to MkDocs for technical writers. Covers installation, configuration, GitHub Pages deployment, custom domains, and troubleshooting. Written for Docs-as-Code workflows.

repo_name: Douglasebhoman/mkdocs-for-technical-writers
repo_url: https://github.com/Douglasebhoman/mkdocs-for-technical-writers

theme:
  name: material
  palette:
    scheme: slate
    primary: custom
    accent: custom
  font:
    text: false
    code: false
  features:
    - navigation.instant
    - navigation.top
    - navigation.sections
    - navigation.footer
    - search.highlight
    - search.suggest
    - content.code.copy
  icon:
    repo: fontawesome/brands/github
  custom_dir: overrides

extra_css:
  - stylesheets/brand.css

nav:
  - Home: index.md
  - What is MkDocs: what-is-mkdocs.md
  - Prerequisites: prerequisites.md
  - Installation: installation.md
  - Creating a Project: creating-a-project.md
  - Configuring mkdocs.yml: configuring-mkdocs-yml.md
  - Writing Content: writing-content.md
  - Previewing Locally: previewing-locally.md
  - Deploying to GitHub Pages: deploying-to-github-pages.md
  - Custom Domain: custom-domain.md
  - Troubleshooting: troubleshooting.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - def_list
  - tables
  - toc:
      permalink: true

extra:
  share_image:
    url: https://douglasebhoman.com/assets/images/mkdocs-for-technical-writers-card.png
    width: 1731
    height: 909
  social:
    - icon: fontawesome/brands/linkedin
      link: https://linkedin.com/in/douglas-ebhoman-757329289
    - icon: fontawesome/brands/github
      link: https://github.com/Douglasebhoman
    - icon: fontawesome/solid/globe
      link: https://douglasebhoman.com

copyright: '© 2026 Douglas Ebhoman · <a href="https://douglasebhoman.com">douglasebhoman.com</a>'